name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Toolchain
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib

      - name: Check legacy web APIs
        run: |
          if grep -R "dart:html\|dart:js'\|package:js/" lib; then
            echo "Legacy web API import found."
            exit 1
          fi

      - name: Analyze package
        run: flutter analyze lib test

      - name: Test package
        run: flutter test

      - name: Validate WebAssembly build
        working-directory: example
        run: |
          flutter pub get
          flutter analyze lib
          flutter build web --wasm
