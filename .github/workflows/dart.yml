name: CI

on:
  push:
    branches: [master]

jobs:
  validate:
    runs-on:
      - self-hosted
      - devs-flutter-plugin-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runner dependencies
        run: |
          if ! command -v xz >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xz-utils
          fi
          xz --version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Toolchain
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test/getstorage_test.dart example/lib

      - name: Check legacy web APIs
        run: |
          if grep -R "dart:html\|dart:js'\|package:js/" lib; then
            echo "Legacy web API import found."
            exit 1
          fi

      - name: Analyze package
        run: flutter analyze lib test/getstorage_test.dart

      - name: Test package
        run: flutter test test/getstorage_test.dart

      - name: Validate WebAssembly build
        working-directory: example
        run: |
          flutter pub get
          flutter analyze lib
          flutter build web --wasm
